# Downstream dense-task training (linear probe / fine-tune).
defaults:
  - task: dsec_semantic
  - model: vit_base_linear_probe
  - optimization: default
  - meta: default
  - _self_

# Base output directory for checkpoints/logs/tensorboard.
folder: outputs/downstream

hydra:
  run:
    dir: ${folder}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  output_subdir: null
