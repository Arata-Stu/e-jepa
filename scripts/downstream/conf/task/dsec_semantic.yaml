name: dsec_semantic
dataset_kind: dsec
target: semantic

# Preprocessed voxel H5 roots.
train_roots: []
val_roots: []
file_pattern: "*.h5"
recursive: true

# Input clip sampling around each labeled anchor window.
clip_num_frames: 2
clip_frame_stride: 1
# Optional spatial resize before the downstream model. null keeps H5 resolution.
input_size: null
input_resize_mode: bilinear
# For validation, compute mIoU after resizing logits back to the raw label-aligned HxW.
eval_original_resolution: true
eval_logits_resize_mode: bilinear

# Loader.
batch_size: 4
num_workers: 4
pin_mem: true
persistent_workers: true

# Semantic settings.
num_classes: 11
ignore_index: 255
infer_num_classes_max_samples: 256

# Common settings.
require_labels: true
depth_scale: 1.0
depth_valid_min: 0.0
depth_valid_max: 1000000000.0
