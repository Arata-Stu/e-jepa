# Encoder backbone.
compile_model: false
use_activation_checkpointing: true
model_name: vit_base
# Input channels for voxel grid. For split_polarity + t_bins=10, set 20.
in_chans: 20

uniform_power: true
use_rope: true
use_silu: false
wide_silu: true
is_causal: false
init_type: default
# If set (usually 1), model can use image branch for that temporal length.
img_temporal_dim_size: null
n_registers: 0
has_cls_first: false
interpolate_rope: true
modality_embedding: false

# MAE objective params.
mask_ratio: 0.75
loss_type: l2 # l1 or l2
norm_pix_loss: false

# Decoder params.
decoder_embed_dim: 512
decoder_depth: 4
decoder_num_heads: 8
decoder_mlp_ratio: 4.0

