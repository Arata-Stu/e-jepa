# Event H5 loader (stage-1 video branch).
dataset_type: eventdataset
# One or more roots / manifests / .h5 files. Must be set from CLI or local yaml.
datasets: []
# Optional mixing weights aligned with `datasets`.
datasets_weights: null
# Frames-per-clip per dataset. [16] means pseudo-video of length 16.
dataset_fpcs: [16]
# Per-rank batch size (not global).
batch_size: 8
# Final model/mask spatial size [H, W] after augmentation/padding.
crop_size: [480, 640]
patch_size: 16
# Temporal patch size used by ViT patch embedding.
tubelet_size: 2
# Target clip FPS. When set, clips are subsampled from H5 anchor timestamps in
# a vjepa-style manner. If null, `frame_sample_rate` is used instead.
fps: 4
num_workers: 8
persistent_workers: true
# Dataloader prefetch per worker. null => framework default (usually 2).
prefetch_factor: null
# Max opened HDF5 files per dataloader worker (LRU cache).
max_open_h5_files: 32
pin_mem: true
# Temporal subsampling stride before fpc fitting. Used when `fps` is null.
frame_sample_rate: 1
# Number of clips sampled from one sample each iteration.
num_clips: 1
random_clip_sampling: true
allow_clip_overlap: false
# Scan options for directory mode.
file_pattern: "*.h5"
recursive: true
# Optional clip-level activity filtering. Scalars apply to all datasets; lists align with `datasets`.
activity_filter_enabled: false
activity_filter_min_clip_mean_active_pixel_ratio: null
activity_filter_min_clip_mean_activity_score: null
activity_filter_min_clip_active_window_ratio: null
activity_filter_active_window_threshold: null
