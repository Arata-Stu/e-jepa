# Optional image-like branch (vjepa2.1 rank split style).
# This still reads event H5, but with single timestamp samples.
enabled: true
dataset_type: eventdataset
# Set the image-branch dataset root(s) from CLI.
datasets: []
datasets_weights: null
# Single timestamp sample.
dataset_fpcs: [1]
# Per-rank batch size for image ranks.
batch_size: 8
crop_size: [480, 640]
num_workers: 8
# Fraction of ranks assigned to image branch. Example: 0.25 => 25%.
rank_ratio: 0.25
