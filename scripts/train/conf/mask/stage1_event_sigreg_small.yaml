# Small uniform-location masks for controlled stop-grad/EMA vs SIGReg runs.
# Both collapse-prevention modes should use this identical preset.
- num_blocks: 4
  spatial_scale: [0.04, 0.08]
  temporal_scale: [1.0, 1.0]
  aspect_ratio: [0.75, 1.5]
  max_temporal_keep: 1.0
  max_keep: null
  full_complement: false
  location_strategy: random

- num_blocks: 1
  spatial_scale: [0.10, 0.16]
  temporal_scale: [1.0, 1.0]
  aspect_ratio: [0.75, 1.5]
  max_temporal_keep: 1.0
  max_keep: null
  full_complement: false
  location_strategy: random
