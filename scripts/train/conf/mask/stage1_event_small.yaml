# Gentler video/event masks for low-resolution stability checks.
# Intended for 240x320 / ViT-Tiny runs where the default large block can be harsh.
- num_blocks: 4
  spatial_scale: [0.12, 0.18]
  temporal_scale: [1.0, 1.0]
  aspect_ratio: [0.75, 1.5]
  max_temporal_keep: 1.0
  max_keep: null
  full_complement: false

- num_blocks: 1
  spatial_scale: [0.25, 0.35]
  temporal_scale: [1.0, 1.0]
  aspect_ratio: [0.75, 1.5]
  max_temporal_keep: 1.0
  max_keep: null
  full_complement: false
